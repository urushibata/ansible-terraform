- name: SetUp WSL. [Ubuntu]
  hosts: local
  pre_tasks:
    - name: Import pre tasks
      ansible.builtin.import_tasks: pre_tasks.yml

  roles:
    - role: docker
    - role: terraform
      vars:
        terraform_tag: 1.11.1
        tflint_tag: v0.55.1
        trivy_tag: v0.60.0
        terraform_docs_tag: v0.18.0
    - role: cue
      vars:
        cuelang_tag: v0.12.0

  post_tasks:
    - name: Import post tasks
      ansible.builtin.import_tasks: post_tasks.yml
